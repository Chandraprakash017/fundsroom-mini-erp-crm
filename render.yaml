services:
  # Backend API Web Service
  - type: web
    name: fundsroom-erp-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fundsroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # Frontend static web site
  - type: web
    name: fundsroom-erp-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    publishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Note: Once the backend is created, Render will define this value.
        # Alternatively, you can configure this on Render dashboard.
        value: https://fundsroom-erp-backend.onrender.com/api

databases:
  - name: fundsroom-db
    plan: free
